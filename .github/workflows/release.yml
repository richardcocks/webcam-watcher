# Builds a self-contained single-file exe and publishes it as a GitHub release when a v* tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish WebcamWatcher.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$($env:TAG.TrimStart('v')) -o publish
          $hash = (Get-FileHash publish/webcam-watcher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  webcam-watcher.exe" | Out-File publish/webcam-watcher.exe.sha256 -Encoding ascii

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG publish/webcam-watcher.exe publish/webcam-watcher.exe.sha256 `
            --title $env:TAG --generate-notes `
            --notes "Self-contained single-file build for Windows x64; no .NET install needed. See the README for usage and the Home Assistant setup."
